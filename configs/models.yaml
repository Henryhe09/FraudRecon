models:
  mock-main:
    provider: mock
    mode: main
    supports_audio: true

  mock-judge:
    provider: mock
    mode: judge
    supports_audio: false

  local-vllm-text:
    provider: openai_compatible
    base_url: http://127.0.0.1:8000/v1
    api_key_env: VLLM_API_KEY
    model_name: Qwen/Qwen3-8B
    chat_template_kwargs:
      enable_thinking: false
    timeout_seconds: 180
    max_retries: 5
    supports_audio: false

  local-vllm-audio:
    provider: openai_compatible
    base_url: http://127.0.0.1:8001/v1
    api_key_env: VLLM_API_KEY
    model_name: Qwen/Qwen2.5-Omni-7B
    timeout_seconds: 180
    max_retries: 5
    supports_audio: true

  example-openai-compatible-text:
    provider: openai_compatible
    base_url: https://your-endpoint.example/v1
    api_key_env: OPENAI_COMPATIBLE_API_KEY
    model_name: your-text-model
    timeout_seconds: 180
    max_retries: 5
    supports_audio: false

  example-openai-compatible-judge:
    provider: openai_compatible
    base_url: https://your-endpoint.example/v1
    api_key_env: OPENAI_COMPATIBLE_API_KEY
    model_name: your-judge-model
    timeout_seconds: 180
    max_retries: 5
    supports_audio: false
