[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudrecon"
version = "0.1.0"
description = "FraudRecon benchmark and narrative-to-dialogue reconstruction"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["openai", "httpx>=0.27", "PyYAML>=6", "fastapi>=0.115", "uvicorn>=0.30"]

[project.optional-dependencies]
progress = ["tqdm"]

[project.scripts]
ndrr = "ndrr.cli:main"
fraudrecon-bench = "bench.cli:main"

[tool.setuptools.packages.find]
include = ["ndrr*", "bench*"]

[tool.setuptools.package-data]
bench = ["README.md", "prompts/*.txt", "configs/*.yaml", "examples/*.jsonl", "examples/*.md", "examples/samples/*.json", "scripts/*.ps1"]
ndrr = ["README.md", "examples/*.json"]
"ndrr.annotation" = ["signal_rules.txt"]
