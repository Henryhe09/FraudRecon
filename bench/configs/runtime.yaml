runtime:
  default_dataset_root: "./bench/examples"
  split_dataset_roots: {}
  default_split: "test"
  default_input_mode: "text" # text | audio | multimodal
  eval_mode: "full" # full | without_phases | dialogue_only | detection_only | category_only | signals_only | reasoning_only | phase_only
  db_path: "./outputs/bench/eval_runs.db"
  artifacts_dir: "./outputs/bench"
  api_max_workers: 4
  round1_max_tokens: 4096
  dump_raw_responses: false
  strip_tone_hints: false
  max_retries: 2
  backoff_seconds: 2
  max_backoff_seconds: 20
  jitter_ratio: 0.25
